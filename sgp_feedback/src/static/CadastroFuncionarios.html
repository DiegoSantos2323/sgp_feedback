<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGP - Cadastro de Funcionário</title>
<link rel="stylesheet" href="css/CadastroFuncionario.css">
</head>
<body>

<main class="container">

<section class="lado-esquerdo">

<img src="logo.png" alt="Logo SGP" class="logo">

<h1>Cadastro de Funcionários</h1>

<p>
Cadastre e gerencie colaboradores<br>
de forma simples e organizada.
</p>

</section>

<h2>Dados Pessoais</h2>

<p class="subtitulo">
Preencha os dados pessoais do funcionário
</p>

<form action="cadastro-profissional.html">

<div class="grupo">
<label>Nome Completo *</label>
<input type="text" required>
</div>

<div class="linha-campos">

<div class="grupo">
<label>CPF *</label>
<input type="text" required>
</div>

<div class="grupo">
<label>RG</label>
<input type="text">
</div>

</div>

<div class="linha-campos">

<div class="grupo">
<label>Data de Nascimento *</label>
<input type="date" required>
</div>

<div class="grupo">
<label>Sexo *</label>
<select required>
<option value="">Selecione</option>
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
</select>
</div>

</div>

<div class="grupo">
<label>Estado Civil</label>
<select>
<option value="">Selecione</option>
<option>Solteiro(a)</option>
<option>Casado(a)</option>
<option>Divorciado(a)</option>
<option>Viúvo(a)</option>
</select>
</div>

<h3>Contato</h3>

<div class="grupo">
<label>E-mail *</label>
<input type="email" required>
</div>

<div class="grupo">
<label>Telefone *</label>
<input type="text" required>
</div>

<h3>Endereço</h3>

<div class="grupo">
<label>Endereço *</label>
<input type="text" required>
</div>

<div class="linha-campos">

<div class="grupo">
<label>Cidade *</label>
<input type="text" required>
</div>

<div class="grupo">
<label>Estado *</label>
<input type="text" required>
</div>

</div>

<div class="grupo">
<label>CEP *</label>
<input type="text" required>
</div>

<button type="submit">
Próximo →
</button>

</form>

</section>

</main>

</body>
</html>
