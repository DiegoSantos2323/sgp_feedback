<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Desempenho</title>
    <link rel="stylesheet" href="css/AvaliacaoDeDesempenho.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body id="page-body">

    <div id="dashboard-container">
        
        <header id="main-header">
            <div id="header-title-container">
              <a href="Principal.html" id="btn-back" class="btn-icon">
    			<i class="fa-solid fa-chevron-left"></i>
				</a>
                <div>
                    <h1 id="page-title">Avaliação de Desempenho</h1>
                    <p id="page-subtitle">Registre feedbacks e acompanhe a evolução dos colaboradores</p>
                </div>
            </div>
			<button id="btn-new-evaluation" class="btn-primary"
			        onclick="window.location.href='CriarAvaliacaoDeDesempenho.html'">
			    <i class="fa-solid fa-plus"></i> Nova Avaliação
			</button>     
   </header>

        <section id="metrics-overview">
            <div id="card-total-evaluations" class="metric-card">
                <span class="metric-label">Total de Avaliações</span>
                <span class="metric-value" id="totalAvaliacoes">0</span>
            </div>
            <div id="card-average-score" class="metric-card card-highlight-yellow">
                <span class="metric-label">Média de Nota</span>
               <span class="metric-value" id="mediaNota">0 / 5</span>
            </div>
            <div id="card-average-achievement" class="metric-card card-highlight-blue">
                <span class="metric-label">Média de Atingimento</span>
                <span class="metric-value" id="mediaPercentual">0%</span>
            </div>
            <div id="card-general-classification" class="metric-card card-highlight-purple">
                <span class="metric-label">Classificação Geral</span>
                <span class="metric-value text-purple" id="classificacaoGeral">---</span>
            </div>
        </section>

        <section id="search-section">
            <div id="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass" id="search-icon"></i>
                <input type="text" id="input-search" placeholder="Buscar por funcionário ou meta...">
            </div>
        </section>

        <section id="classification-legend-container">
            <span id="legend-title">Classificação:</span>
            <div id="legend-badges">
                <span class="badge badge-excelente">>100% Excelente</span>
                <span class="badge badge-muito-bom">90-99% Muito Bom</span>
                <span class="badge badge-bom">70-89% Bom</span>
                <span class="badge badge-regular">50-69% Regular</span>
                <span class="badge badge-melhorias">&lt;50% Necessita Melhorias</span>
            </div>
        </section>

        <main id="collaborators-list">
            
          <main id="collaborators-list">

		</main>

           <main id="collaborators-list">

			</main>

            <main id="collaborators-list">

			</main>

        </main>
    </div>

</body>
</html>
