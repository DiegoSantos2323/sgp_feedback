<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGP - Metas de Funcionários</title>
  <link rel="stylesheet" href="css/MetasFuncionarios.css">
	<script src="js/MetasFuncionariosPrincipal.js"></script>
</head>
<body>

<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="header-esquerdo">
      <a href="Principal.html" class="btn-icon">&#8592;</a>
      <div>
        <h1 class="header-titulo">Metas de Funcionários</h1>
        <p class="header-sub">Cadastre e acompanhe o desempenho individual dos colaboradores</p>
      </div>
    </div>
    <a href="CriacaoMetasFuncionarios.html" class="btn-primario">&#43; Nova Meta</a>
  </div>

  <!-- Cards de resumo -->
  <div class="resumo-cards">
    <div class="resumo-card">
      <p class="resumo-label">Total de Metas</p>
      <p class="resumo-valor cor-azul-escuro"  id="totalMetas">0</p>
    </div>
    <div class="resumo-card bg-azul">
      <p class="resumo-label"  >Em Andamento</p>
      <p class="resumo-valor cor-azul" id="metasAndamento">2</p>
    </div>
    <div class="resumo-card bg-verde">
      <p class="resumo-label" >Concluídas</p>
      <p class="resumo-valor cor-verde" id="metasConcluidas">2</p>
    </div>
    <div class="resumo-card bg-roxo">
      <p class="resumo-label" >Média Geral</p>
      <p class="resumo-valor cor-roxo" id="mediaGeral">92%</p>
    </div>
  </div>

  <!-- Filtros e busca -->
  <div class="filtros-bar">
    <div class="busca-wrap">
      <span class="busca-icone">&#128269;</span>
      <input type="text" class="busca-input" placeholder="Buscar por funcionário ou meta...">
    </div>
    <div class="filtro-select">
      <span>&#127919;</span>
      <select>
        <option value="">Todos os tipos</option>
        <option>Vendas</option>
        <option>Atendimento</option>
        <option>Estoque</option>
        <option>Financeiro</option>
      </select>
    </div>
    <div class="filtro-select">
      <span>&#128202;</span>
      <select>
        <option value="">Todos os status</option>
        <option>Em Andamento</option>
        <option>Concluída</option>
      </select>
    </div>
  </div>

  <!-- Lista de metas -->
 <div class="metas-lista" id="listaMetas">

</div>


</div>

</body>
</html>
